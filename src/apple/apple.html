<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple Card Layout</title>
    <link rel="icon" href="./favicon/apple-favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon/apple-favicon.svg" />
    <link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT/fonts/variable/woff2/SUIT-Variable.css" rel="stylesheet" />
    <link rel="stylesheet" href="./styles/apple.css" />
  </head>
  <body>
    <section class="products">
      <div class="ipad-pro">
        <div class="contents">
          <strong><h2 class="white">iPad Pro</h2></strong>
          <p class="white">놀라우리만치 얇다.<br />엄청나게 강력하다.</p>
          <p class="release">출시일 추후 공개</p>
          <div class="button-group">
            <button type="button" class="blue-white">더 알아보기</button>
            <button type="button" class="trans-blue">가격 보기</button>
          </div>
        </div>
      </div>
      <div class="ipad-air">
        <div class="contents">
          <strong><h2 class="black">iPad Air</h2></strong>
          <p class="black">두 가지 사이즈. 더 빠른 칩.<br />무엇이든 거뜬하게.</p>
          <p class="release">출시일 추후 공개</p>
          <div class="button-group">
            <button type="button" class="black-white">더 알아보기</button>
            <button type="button" class="trans-black">가격 보기</button>
          </div>
        </div>
      </div>
      <div class="iphone15-pro">
        <div class="contents">
          <strong><h2 class="white">iPhone 15 Pro</h2></strong>
          <p class="white">티타늄. 초강력. 초경량. 초프로.</p>
          <div class="button-group">
            <button type="button" class="blue-white">더 알아보기</button>
            <button type="button" class="trans-blue">가격 보기</button>
          </div>
        </div>
      </div>
      <div class="grid-layout">
        <div class="iphone15">
          <div class="contents">
            <strong><h2 class="black">iPhone 15</h2></strong>
            <p class="black">새로운 카메라.<br />새로운 디자인.<br />새로움이 물씬.</p>
            <div class="button-group">
              <button type="button" class="black-white">더 알아보기</button>
              <button type="button" class="trans-black">가격 보기</button>
            </div>
          </div>
        </div>
        <div class="watch">
          <div class="contents">
            <strong><h2 class="white">WATCH</h2></strong>
            <p class="white">보다 똑똑. 보다 또렷. 보다 강력.</p>
            <div class="button-group">
              <button type="button" class="blue-white">더 알아보기</button>
              <button type="button" class="trans-blue">가격 보기</button>
            </div>
          </div>
        </div>
        <div class="macbook">
          <div class="contents">
            <strong><h2 class="black">MacBook Air</h2></strong>
            <p class="black">날씬하게. 강력하게. M3답게.</p>
            <div class="button-group">
              <button type="button" class="black-white">더 알아보기</button>
              <button type="button" class="trans-black">가격 보기</button>
            </div>
          </div>
        </div>
        <div class="airpods">
          <div class="contents">
            <strong><h2 class="white">airPods Pro</h2></strong>
            <p class="white">전에 없던 청취 경험<br />적응형 오디오.</p>
            <div class="button-group">
              <button type="button" class="blue-white">더 알아보기</button>
              <button type="button" class="trans-blue">가격 보기</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
